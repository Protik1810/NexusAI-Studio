[package]
name = "nexusai-studio"
version = "1.0.0"
description = "NexusAI Local Studio"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-execute", "shell-sidecar", "windows7-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
