name: Build Linux/macOS/Windows Installers

# Builds the Solframe Studio UI shell as a native Linux (AppImage/.deb),
# macOS (.dmg/.zip), and Windows (Lightweight .exe) package. These are all
# built from git-tracked source only, so none bundle the
# stable-diffusion.cpp/llama.cpp acceleration engines (see README
# "Platform status") — the packaged app is the interface only, same scope
# as install.sh today, just as an installable native app.
#
# The Windows *Complete* installer (with the CUDA/Vulkan/llama.cpp engine
# binaries bundled in) is still built locally, not here — those binaries
# are large enough that they're deliberately not checked into this repo,
# so there's nothing for a CI runner to bundle them from. The Lightweight
# installer built here has no such dependency and is fully reproducible.
#
# Every artifact this workflow builds gets a GitHub build-provenance
# attestation (actions/attest-build-provenance), which anyone can verify
# with `gh attestation verify <file> --repo Protik1810/Solframe-Studio` —
# it cryptographically ties the file back to this exact workflow run and
# source commit. The manually-built Windows Complete installer has no such
# attestation, since it isn't produced by this (or any) CI run.
#
# On a version tag push, the final job collects everything the three build
# jobs produced and opens a DRAFT GitHub Release with them attached, plus a
# CHECKSUMS.txt covering exactly those files. It's a draft, not published,
# on purpose: the Windows Complete/Portable installers and the real
# (engine-bundled) macOS build still have to be built and uploaded by hand
# (see RELEASING.md) before the release is complete — publishing
# automatically here would ship a release missing its main downloads.

# NOT triggered by tag pushes any more — manual dispatch only.
#
# Releases are now built locally for all three platforms with the
# stable-diffusion.cpp/llama.cpp engines bundled, and published directly
# with `gh release create`. This workflow only ever produced UI-only
# artifacts (the engine binaries aren't in the repo for it to bundle), so
# on a `v*` tag it raced that real release and its draft-release job would
# attach engine-less builds over the working ones. Every release since has
# had to have this run cancelled by hand within seconds of tagging.
#
# Keeping workflow_dispatch means the UI-only builds and their provenance
# attestations are still available on demand, without CI taking part in
# releases it can't actually complete.
on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Also open a draft GitHub Release with these UI-only artifacts'
        type: boolean
        default: false

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build:linux

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: solframe-studio-linux
          path: |
            release/*.AppImage
            release/*.deb

  build-mac:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build:mac

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: solframe-studio-macos
          path: |
            release/*.dmg
            release/*.zip

  build-windows-lightweight:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run electron:build

      - name: Install Inno Setup
        run: choco install innosetup -y

      - run: npm run build:installer:lightweight

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: installer-output/*-Lightweight.exe

      - uses: actions/upload-artifact@v4
        with:
          name: solframe-studio-windows-lightweight
          path: installer-output/*-Lightweight.exe

  draft-release:
    # Opt-in only. These artifacts are UI-only — no engines — so attaching
    # them to a release is almost never what you want; the real release is
    # built locally and published with `gh release create`. This exists for
    # the rare case of wanting a draft of the engine-less builds.
    if: inputs.draft_release
    needs: [build-linux, build-mac, build-windows-lightweight]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Generate checksums for these artifacts
        working-directory: dist-artifacts
        run: sha256sum * > CHECKSUMS.txt

      - name: Open a draft release with what CI could build
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Solframe Studio ${{ github.ref_name }}
          body: |
            Draft opened automatically by CI from this tag's build. **Not ready to publish yet** — the following still need to be built and uploaded by hand (see [RELEASING.md](https://github.com/${{ github.repository }}/blob/main/RELEASING.md)):
            - The Windows Complete and Portable installers (real inference engines bundled — CI only has access to `backend/win/` binaries if `fetch-engines.js` was run on this runner, which it isn't yet)
            - The real macOS build with `backend/mac/` bundled (this release's `.dmg`/`.zip` are UI-shell-only, same gap as the Linux build)
            - A regenerated `CHECKSUMS.txt` covering *all* final assets (this draft's `CHECKSUMS.txt` only covers what CI itself built)
            - The actual release notes (see [RELEASE_NOTES.md](https://github.com/${{ github.repository }}/blob/main/RELEASE_NOTES.md))
          files: dist-artifacts/*
